<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Activity – Mitspielen</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --cream: #f2ece0;
        --coral: #f2735c;
        --yellow: #f5e94a;
        --navy: #16215a;
        --navy-soft: #16215a99;
        --white: #ffffff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background: var(--cream);
        color: var(--navy);
      }
      body { display: flex; flex-direction: column; padding: 1.5rem 1.25rem; gap: 1.25rem; }
      h1 { font-size: 26px; font-weight: 800; text-align: center; }
      h1 span { color: var(--coral); }
      input {
        font-family: inherit;
        font-size: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 2px solid var(--navy);
        background: var(--white);
        color: var(--navy);
        width: 100%;
      }
      input::placeholder { color: var(--navy-soft); }
      button {
        font-family: inherit;
        font-size: 17px;
        font-weight: 700;
        padding: 16px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        width: 100%;
      }
      .btn-primary { background: var(--coral); color: var(--white); }
      .btn-secondary { background: var(--white); color: var(--navy); border: 2px solid var(--navy); }
      .btn-correct { background: #2ecc71; color: #06220f; font-size: 24px; padding: 28px; }
      .btn-skip { background: var(--white); color: var(--navy); border: 2px solid var(--navy); }
      .error { color: #c0392b; font-size: 14px; text-align: center; }
      .center { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 1rem; text-align: center; }
      .card {
        background: var(--white);
        border: 2px solid var(--navy);
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
      }
      .card.active { border-color: var(--coral); }
      .card .score { color: var(--coral); font-weight: 800; font-size: 20px; }
      .list { display: flex; flex-direction: column; gap: 10px; }
      .category-chip {
        align-self: center;
        background: var(--yellow);
        border: 2px solid var(--navy);
        border-radius: 14px;
        padding: 8px 18px;
        font-size: 15px;
        font-weight: 700;
      }
      .word-box {
        background: var(--white);
        border: 2px solid var(--coral);
        border-radius: 20px;
        padding: 28px 20px;
        text-align: center;
        font-size: 34px;
        font-weight: 800;
        width: 100%;
      }
      .timer { font-size: 40px; font-weight: 800; color: var(--coral); text-align: center; }
      .correct-count { text-align: center; color: var(--navy-soft); font-size: 15px; }
      .word-mini {
        text-align: center;
        font-size: 20px;
        font-weight: 800;
        color: var(--coral);
      }
      .draw-canvas {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #fff;
        border: 2px solid var(--navy);
        border-radius: 18px;
        touch-action: none;
        display: block;
      }
      .draw-row { display: flex; gap: 10px; }
      .draw-row button { padding: 12px; }
      .btn-clear { background: var(--white); color: var(--navy); border: 2px solid var(--navy); font-size: 14px; }
      .palette { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .swatch {
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 50%;
        border: 3px solid transparent;
        padding: 0;
        cursor: pointer;
      }
      .swatch.active { border-color: var(--navy); }
      .swatch.eraser {
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        border: 3px solid var(--navy-soft);
      }
      .swatch.eraser.active { border-color: var(--coral); }
    </style>
  </head>
  <body>
    <div id="main" style="flex:1;display:flex;flex-direction:column;gap:1.25rem"></div>

    <script>
      const socket = io();
      let state = null;
      let roomCode = localStorage.getItem("activityRoomCode") || "";
      let playerId = localStorage.getItem("activityPlayerId") || "";
      let playerName = localStorage.getItem("activityPlayerName") || "";
      let joined = false;
      let joinError = "";
      let myWord = null;

      function renderJoinForm() {
        document.getElementById("main").innerHTML = `
          <h1>🎭 Activity<span>.</span></h1>
          <div class="center" style="gap:14px">
            <input id="codeInput" placeholder="Raum-Code" maxlength="4" value="${roomCode}" style="text-transform:uppercase;text-align:center;letter-spacing:0.1em;font-weight:800" />
            <input id="nameInput" placeholder="Dein Name" maxlength="24" value="${playerName}" />
            ${joinError ? `<div class="error">${joinError}</div>` : ""}
            <button class="btn-primary" onclick="doJoin()">Beitreten</button>
          </div>
        `;
      }

      function doJoin() {
        const code = document.getElementById("codeInput").value.trim().toUpperCase();
        const name = document.getElementById("nameInput").value.trim();
        if (!code || !name) {
          joinError = "Bitte Code und Namen eingeben";
          renderJoinForm();
          return;
        }
        socket.emit("player:join", { code, name, playerId }, (res) => {
          if (!res.ok) {
            joinError = res.error || "Beitreten fehlgeschlagen";
            renderJoinForm();
            return;
          }
          roomCode = code;
          playerId = res.playerId;
          playerName = res.name;
          localStorage.setItem("activityRoomCode", roomCode);
          localStorage.setItem("activityPlayerId", playerId);
          localStorage.setItem("activityPlayerName", playerName);
          joined = true;
          joinError = "";
          render();
        });
      }

      if (roomCode && playerId && playerName) {
        const tryAutoJoin = () => {
          socket.emit("player:join", { code: roomCode, name: playerName, playerId }, (res) => {
            if (res.ok) {
              playerId = res.playerId;
              joined = true;
              render();
            } else {
              renderJoinForm();
            }
          });
        };
        if (socket.connected) tryAutoJoin();
        else socket.on("connect", tryAutoJoin);
      } else {
        renderJoinForm();
      }

      function joinTeam(teamId) {
        socket.emit("player:joinTeam", { code: roomCode, teamId });
        if (state) {
          state.teams.forEach((t) => {
            t.players = t.players.filter((p) => p.id !== playerId);
          });
          const target = state.teams.find((t) => t.id === teamId);
          if (target) target.players.push({ id: playerId, name: playerName, connected: true });
          render();
        }
      }

      function sendReady() {
        socket.emit("player:ready", { code: roomCode });
      }

      function sendCorrect() {
        socket.emit("player:correct", { code: roomCode });
      }

      function sendSkip() {
        socket.emit("player:skip", { code: roomCode });
      }

      function sendClear() {
        socket.emit("draw:clear", { code: roomCode });
      }

      function sendUndo() {
        socket.emit("draw:undo", { code: roomCode });
      }

      const PEN_COLORS = ["#1a1a1a", "#e74c3c", "#e67e22", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6"];
      const PEN_WIDTH = 6;
      const ERASER_COLOR = "#ffffff";
      const ERASER_WIDTH = 28;

      let currentColor = PEN_COLORS[0];
      let currentWidth = PEN_WIDTH;
      let drawCtx = null;
      let drawingNow = false;
      let strokePoints = [];

      function setColor(c) {
        currentColor = c;
        currentWidth = PEN_WIDTH;
        render();
      }

      function setEraser() {
        currentColor = ERASER_COLOR;
        currentWidth = ERASER_WIDTH;
        render();
      }

      function isEraser() {
        return currentColor === ERASER_COLOR;
      }

      function paletteHtml() {
        return `
          <div class="palette">
            ${PEN_COLORS.map((c) => `<button class="swatch ${currentColor === c ? "active" : ""}" style="background:${c}" onclick="setColor('${c}')"></button>`).join("")}
            <button class="swatch eraser ${isEraser() ? "active" : ""}" onclick="setEraser()">🧹</button>
          </div>
        `;
      }

      function relPos(e, canvas) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / rect.width,
          y: (e.clientY - rect.top) / rect.height,
        };
      }

      function redrawStrokes(ctx, strokes) {
        const canvas = ctx.canvas;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        (strokes || []).forEach((s) => {
          if (!s.points || s.points.length < 2) return;
          ctx.strokeStyle = s.color;
          ctx.lineWidth = s.width;
          ctx.beginPath();
          ctx.moveTo(s.points[0].x * canvas.width, s.points[0].y * canvas.height);
          for (let i = 1; i < s.points.length; i++) {
            ctx.lineTo(s.points[i].x * canvas.width, s.points[i].y * canvas.height);
          }
          ctx.stroke();
        });
      }

      function attachDrawCanvas(id, interactive, strokes) {
        const canvas = document.getElementById(id);
        if (!canvas) return;
        canvas.width = 800;
        canvas.height = 600;
        drawCtx = canvas.getContext("2d");
        drawCtx.lineCap = "round";
        drawCtx.lineJoin = "round";
        redrawStrokes(drawCtx, strokes);
        if (!interactive) return;

        canvas.addEventListener("pointerdown", (e) => {
          drawingNow = true;
          const { x, y } = relPos(e, canvas);
          strokePoints = [{ x, y }];
          drawCtx.strokeStyle = currentColor;
          drawCtx.lineWidth = currentWidth;
          drawCtx.beginPath();
          drawCtx.moveTo(x * canvas.width, y * canvas.height);
          socket.emit("draw:start", { code: roomCode, x, y, color: currentColor, width: currentWidth });
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!drawingNow) return;
          const { x, y } = relPos(e, canvas);
          strokePoints.push({ x, y });
          drawCtx.lineTo(x * canvas.width, y * canvas.height);
          drawCtx.stroke();
          socket.emit("draw:move", { code: roomCode, x, y });
        });
        const endStroke = () => {
          if (!drawingNow) return;
          drawingNow = false;
          if (strokePoints.length >= 2) {
            socket.emit("draw:strokeEnd", { code: roomCode, color: currentColor, width: currentWidth, points: strokePoints });
          }
          strokePoints = [];
        };
        canvas.addEventListener("pointerup", endStroke);
        canvas.addEventListener("pointerleave", endStroke);
        canvas.addEventListener("pointercancel", endStroke);
      }

      socket.on("draw:event", (e) => {
        if (!drawCtx) return;
        const canvas = drawCtx.canvas;
        if (e.type === "start") {
          drawCtx.strokeStyle = e.color || "#1a1a1a";
          drawCtx.lineWidth = e.width || PEN_WIDTH;
          drawCtx.beginPath();
          drawCtx.moveTo(e.x * canvas.width, e.y * canvas.height);
        } else if (e.type === "move") {
          drawCtx.lineTo(e.x * canvas.width, e.y * canvas.height);
          drawCtx.stroke();
        }
      });

      socket.on("draw:sync", ({ strokes }) => {
        if (!drawCtx) return;
        redrawStrokes(drawCtx, strokes);
      });

      socket.on("turn:word", (w) => {
        myWord = w;
        render();
      });

      socket.on("turn:tick", ({ secondsLeft }) => {
        if (state) state.secondsLeft = secondsLeft;
        const el = document.getElementById("playerTimer");
        if (el) el.textContent = secondsLeft;
      });

      socket.on("room:state", (s) => {
        state = s;
        if (s.phase !== "playing") myWord = null;
        render();
      });

      function myTeam() {
        if (!state) return null;
        return state.teams.find((t) => t.players.some((p) => p.id === playerId)) || null;
      }

      function scoreList() {
        if (!state) return "";
        return `<div class="list">${state.teams
          .map((t) => `<div class="card ${t.id === state.currentTeamId ? "active" : ""}"><span>${t.name}</span><span class="score">${t.score}</span></div>`)
          .join("")}</div>`;
      }

      function render() {
        if (!joined || !state) return;
        const main = document.getElementById("main");
        const team = myTeam();
        drawCtx = null;

        if (!team) {
          main.innerHTML = `
            <h1>🎭 Activity<span>.</span></h1>
            <div style="text-align:center;color:var(--navy-soft)">Wähle dein Team</div>
            ${
              state.teams.length
                ? `<div class="list">${state.teams.map((t) => `<button class="btn-secondary" onclick="joinTeam('${t.id}')">${t.name} (${t.players.length})</button>`).join("")}</div>`
                : `<div style="text-align:center;color:var(--navy-soft)">Warte, bis der Host die Teams auf dem Board anlegt...</div>`
            }
          `;
          return;
        }

        if (state.phase === "lobby") {
          const otherTeams = state.teams.filter((t) => t.id !== team.id);
          main.innerHTML = `
            <h1>🎭 Activity<span>.</span></h1>
            <div style="text-align:center;color:var(--navy-soft)">Du bist in <strong>${team.name}</strong><br/>Warte auf Spielstart...</div>
            ${scoreList()}
            ${
              otherTeams.length
                ? `<div style="text-align:center;color:var(--navy-soft);font-size:14px">Noch wechseln?</div>
                   <div class="list">${otherTeams.map((t) => `<button class="btn-secondary" onclick="joinTeam('${t.id}')">Zu ${t.name} wechseln</button>`).join("")}</div>`
                : ""
            }
          `;
          return;
        }

        const isMe = state.currentPlayerId === playerId;

        if (state.phase === "ready") {
          if (isMe) {
            main.innerHTML = `
              <div class="center" style="gap:16px">
                <div>Du bist dran!</div>
                <div class="category-chip">${state.currentCategoryLabel}</div>
                <button class="btn-primary" onclick="sendReady()">Los!</button>
              </div>
            `;
          } else {
            main.innerHTML = `
              <div class="center" style="gap:14px">
                <div class="category-chip">${state.currentCategoryLabel}</div>
                <div>${state.currentPlayerName} ist dran<br/>(${teamName(state.currentTeamId)})</div>
                <div style="color:var(--navy-soft)">Gleich geht's los...</div>
              </div>
              ${scoreList()}
            `;
          }
          return;
        }

        if (state.phase === "playing") {
          const isDrawing = state.currentCategory === "zeichnen";
          if (isMe) {
            if (isDrawing) {
              main.innerHTML = `
                <div class="timer" id="playerTimer">${state.secondsLeft}</div>
                <div class="word-mini">Zeichne: ${myWord ? myWord.word : "..."}</div>
                <canvas class="draw-canvas" id="drawCanvas"></canvas>
                ${paletteHtml()}
                <div class="draw-row">
                  <button class="btn-clear" onclick="sendUndo()">↩ Rückgängig</button>
                  <button class="btn-clear" onclick="sendClear()">Leeren</button>
                </div>
                <button class="btn-correct" onclick="sendCorrect()">✓ Richtig!</button>
                <button class="btn-skip" onclick="sendSkip()">Überspringen</button>
              `;
              attachDrawCanvas("drawCanvas", true, state.currentStrokes);
            } else {
              main.innerHTML = `
                <div class="category-chip">${state.currentCategoryLabel}</div>
                <div class="timer" id="playerTimer">${state.secondsLeft}</div>
                <div class="word-box">${myWord ? myWord.word : "..."}</div>
                <div class="correct-count">${state.turnCorrectCount} richtig in dieser Runde</div>
                <button class="btn-correct" onclick="sendCorrect()">✓ Richtig!</button>
                <button class="btn-skip" onclick="sendSkip()">Überspringen</button>
              `;
            }
          } else if (isDrawing) {
            main.innerHTML = `
              <div class="timer" id="playerTimer">${state.secondsLeft}</div>
              <div style="text-align:center">${state.currentPlayerName} (${teamName(state.currentTeamId)}) zeichnet</div>
              <canvas class="draw-canvas" id="drawCanvas"></canvas>
              ${scoreList()}
            `;
            attachDrawCanvas("drawCanvas", false, state.currentStrokes);
          } else {
            main.innerHTML = `
              <div class="category-chip">${state.currentCategoryLabel}</div>
              <div class="timer" id="playerTimer">${state.secondsLeft}</div>
              <div style="text-align:center">${state.currentPlayerName} (${teamName(state.currentTeamId)}) ist dran</div>
              ${scoreList()}
            `;
          }
          return;
        }

        if (state.phase === "turnEnd") {
          const s = state.lastSummary || {};
          main.innerHTML = `
            <div class="center" style="gap:14px">
              <div>${s.playerName} (${s.teamName})</div>
              <div style="font-size:30px;font-weight:800;color:var(--coral)">${s.correctCount} richtig!</div>
              <div style="color:var(--navy-soft)">Warte auf nächste Runde...</div>
            </div>
            ${scoreList()}
          `;
          return;
        }

        if (state.phase === "finished") {
          const sorted = state.teams.slice().sort((a, b) => b.score - a.score);
          main.innerHTML = `
            <h1>🏆 Spielende</h1>
            ${sorted.length ? `<div style="text-align:center;font-size:22px;font-weight:800;color:var(--coral)">${sorted[0].name} gewinnt!</div>` : ""}
            ${scoreList()}
          `;
        }
      }

      function teamName(id) {
        if (!state) return "";
        const t = state.teams.find((x) => x.id === id);
        return t ? t.name : "";
      }
    </script>
  </body>
</html>
