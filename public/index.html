<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Activity</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --cream: #f2ece0;
        --coral: #f2735c;
        --yellow: #f5e94a;
        --navy: #16215a;
        --navy-soft: #16215a99;
        --white: #ffffff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Poppins", "Segoe UI", Arial, sans-serif;
        min-height: 100vh;
        background: var(--cream);
        color: var(--navy);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 1.5rem;
        text-align: center;
      }
      h1 { font-size: 42px; font-weight: 800; }
      h1 span { color: var(--coral); }
      .sub { color: var(--navy-soft); font-size: 15px; max-width: 320px; }
      .buttons { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
      button {
        font-family: inherit;
        font-size: 18px;
        font-weight: 700;
        padding: 18px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
      }
      .btn-board { background: var(--coral); color: var(--white); }
      .btn-join { background: var(--white); color: var(--navy); border: 2px solid var(--navy); }
    </style>
  </head>
  <body>
    <div>
      <h1>🎭 Activity<span>.</span></h1>
      <div class="sub">Pantomime, Zeichnen &amp; Erklären – live im Team.</div>
    </div>
    <div class="buttons">
      <button class="btn-board" onclick="location.href='board.html'">📺 Board starten</button>
      <button class="btn-join" onclick="location.href='player.html'">📱 Mitspielen</button>
    </div>
  </body>
</html>
